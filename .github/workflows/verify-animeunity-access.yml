name: Verify AnimeUnity access
on:
  push:
    branches: [verify/animeunity-actions-access]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Check public source endpoints separately
        run: |
          node <<'NODE'
          const fetch = require('node-fetch');
          const endpoints = {
            archive: 'https://animeunity.cx/api/archive?language=ita&sort_by=score&page=1',
            recent: 'https://animeunity.cx/api/home/latest-episodes?language=dub&per_page=20&page=1',
          };
          async function check([name, url]) {
            try {
              const response = await fetch(url, {
                timeout: 8000,
                headers: { Accept: 'application/json', 'User-Agent': 'DubbedAnimeFeed' },
              });
              const contentType = response.headers.get('content-type');
              const mitigation = response.headers.get('cf-mitigated');
              const data = response.ok && contentType?.includes('json') ? await response.json() : {};
              console.log(JSON.stringify({ endpoint: name, status: response.status, contentType, mitigation, count: data.data?.length }));
            } catch (e) {
              console.log(JSON.stringify({ endpoint: name, error: e.message }));
            }
          }
          Promise.all(Object.entries(endpoints).map(check));
          NODE
      - name: Fetch the full archive and latest releases
        run: npm run refresh-dubbed-snapshot
      - name: Check metadata counts and search coverage
        run: |
          node <<'NODE'
          const data = require('./data/dubbed-snapshot.json');
          const naruto = data.archive.filter(anime => /naruto/i.test(anime.title)).length;
          console.log(JSON.stringify({ capturedAt: data.capturedAt, archive: data.archive.length, latest: data.recent.length, Naruto: naruto }));
          if (data.archive.length < 1000 || !data.recent.length || !naruto) process.exit(1);
          NODE
